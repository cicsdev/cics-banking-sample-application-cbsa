plugins {
    id 'java'
    id 'war'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.ibm.cics.cip.bank'
version = '1.0'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
    maven {
        url 'https://public.dhe.ibm.com/ibmdl/export/pub/software/websphere/wasdev/maven/repository/'
    }
}

dependencyManagement {
    imports {
        mavenBom 'com.ibm.cics:com.ibm.cics.ts.bom:6.1-20250812133513-PH63856'
    }
}

dependencies {
    implementation 'jakarta.ws.rs:jakarta.ws.rs-api:4.0.0'
    providedCompile 'jakarta.validation:jakarta.validation-api:3.1.1'
    providedCompile 'com.ibm.websphere.appserver.api:com.ibm.websphere.appserver.api.json:1.0.108'
    providedCompile 'com.ibm.jzos:ibm.jzos:4.0.0.0'
    providedCompile 'com.ibm.cics:com.ibm.cics.server'
    
    implementation 'com.yahoo.platform.yui:yuicompressor:2.4.8'
    implementation 'rhino:js:1.7R2'
    implementation 'org.slf4j:slf4j-simple:1.6.1'
}

sourceSets {
    main {
        java {
            srcDir 'src/main/java'
        }
    }
}

war {
    from('WebContent') {
        exclude 'WEB-INF/web.xml'
    }
    webXml = file('WebContent/WEB-INF/web.xml')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}